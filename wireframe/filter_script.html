  <!-- Filter Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      const categoryCheckboxes = document.querySelectorAll('.filter-category');
      const cityCheckboxes = document.querySelectorAll('.filter-city');
      const partnerCards = document.querySelectorAll('.hi-card');
      const emptyState = document.getElementById('emptyState');
      const partnerGrid = document.getElementById('partnerGrid');
      
      function filterPartners() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        
        // Get active categories
        const activeCategories = Array.from(categoryCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);
          
        // Get active cities
        const activeCities = Array.from(cityCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);
          
        let visibleCount = 0;
        
        partnerCards.forEach(card => {
          const title = card.querySelector('.hi-card-title').textContent.toLowerCase();
          const category = card.getAttribute('data-category');
          const city = card.getAttribute('data-city');
          
          const matchesSearch = title.includes(searchTerm);
          const matchesCategory = activeCategories.length === 0 || activeCategories.includes(category);
          const matchesCity = activeCities.length === 0 || activeCities.includes(city);
          
          if (matchesSearch && matchesCategory && matchesCity) {
            card.style.display = 'flex';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });
        
        // Show/hide empty state
        if (visibleCount === 0) {
          emptyState.style.display = 'flex';
          partnerGrid.style.display = 'none';
        } else {
          emptyState.style.display = 'none';
          partnerGrid.style.display = 'grid';
        }
      }
      
      // Event Listeners
      searchInput.addEventListener('input', filterPartners);
      categoryCheckboxes.forEach(cb => cb.addEventListener('change', filterPartners));
      cityCheckboxes.forEach(cb => cb.addEventListener('change', filterPartners));
    });
  </script>
