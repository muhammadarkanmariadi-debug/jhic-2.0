name: Frontend Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./jhic2.0-frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './jhic2.0-frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Build
      env:
        IGNORE_LINT_DURING_BUILD: 'true'
      run: npm run build
